<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contador de Tokens</title>
<style>
  :root{
    --radius:16px; --radius-sm:10px;
    --font:"Segoe UI",system-ui,sans-serif;
  }
  html[data-theme="dark"]{
    --page:#1b1b19; --card:#262624; --card-2:#2e2d2a; --border:#3a3835;
    --text:#faf9f5; --muted:#8f8d86; --label:#a3a099;
    --track:#3a3835; --shadow:0 10px 30px rgba(0,0,0,.45);
    --titlebar:#141312;
    --green:#4ea96a; --green-t:#7cc98f; --amber:#e0a53e; --red:#e5605a;
    --red-bg:rgba(224,85,78,.14); --red-bd:rgba(224,85,78,.35);
    --orange:#e08c3e; --orange-fill:rgba(224,140,62,.18);
  }
  html[data-theme="light"]{
    --page:#ecebe6; --card:#ffffff; --card-2:#f6f5f1; --border:#e6e4dd;
    --text:#22201c; --muted:#8a887f; --label:#8a887f;
    --track:#eceae4; --shadow:0 8px 24px rgba(60,55,45,.12);
    --titlebar:#111827;
    --green:#3f9d57; --green-t:#2f9a52; --amber:#c98a2c; --red:#d8534c;
    --red-bg:#fdeceb; --red-bd:#f6d5d3;
    --orange:#d9852f; --orange-fill:rgba(217,133,47,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:var(--page);color:var(--text);
    user-select:none;-webkit-user-select:none;overflow:hidden;
    display:flex;flex-direction:column}

  /* ---------- barra de titulo propria ---------- */
  .titlebar{height:36px;flex:none;background:var(--titlebar);display:flex;align-items:center;
    padding:0 6px 0 12px;color:#e8e8ea}
  .titlebar .drag{flex:1;height:100%;display:flex;align-items:center}
  .updated{font-size:11px;color:#9a9a9f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);
    border-radius:20px;padding:3px 10px;font-size:12px;font-weight:600;margin-right:6px}
  .pill .dot{width:8px;height:8px;border-radius:50%}
  .pill.ok{background:rgba(78,169,106,.22);color:#8fe0a5} .pill.ok .dot{background:#4ea96a}
  .pill.warn{background:rgba(224,165,62,.22);color:#f0c877} .pill.warn .dot{background:#e0a53e}
  .pill.crit{background:rgba(229,96,90,.22);color:#f2a09b} .pill.crit .dot{background:#e5605a}
  .winbtn{width:34px;height:26px;border:0;background:transparent;color:#cfcfd4;
    border-radius:6px;cursor:pointer;display:grid;place-items:center}
  .winbtn:hover{background:rgba(255,255,255,.12)}
  .winbtn.close:hover{background:#e5605a;color:#fff}

  /* ---------- cartao ---------- */
  .wrap{padding:12px;flex:1;overflow-y:auto;overflow-x:hidden;zoom:.9}
  .wrap::-webkit-scrollbar{width:9px}
  .wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px;
    border:2px solid transparent;background-clip:padding-box}
  .wrap::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:padding-box}
  .wrap::-webkit-scrollbar-track{background:transparent}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden}
  .head{display:flex;align-items:center;gap:10px;padding:16px 18px 12px}
  .logo{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--muted);
    display:grid;place-items:center;color:var(--text)}
  .head .name{font-size:15px;font-weight:600;flex:1}
  .head .name .ver{font-size:11px;font-weight:600;color:var(--muted);
    font-family:var(--font,"Segoe UI");margin-left:4px;vertical-align:1px}
  .iconbtn{width:30px;height:30px;border:0;background:transparent;color:var(--muted);
    border-radius:8px;cursor:pointer;display:grid;place-items:center}
  .iconbtn:hover{background:var(--card-2);color:var(--text)}

  .banner{display:none;align-items:center;gap:8px;margin:0 14px 4px;padding:10px 12px;
    background:var(--red-bg);border:1px solid var(--red-bd);border-radius:var(--radius-sm);
    color:var(--red);font-size:13px;font-weight:500}
  .banner.show{display:flex}

  .section{padding:12px 18px}
  .section + .section{border-top:1px solid var(--border)}
  .srow{display:flex;align-items:center;justify-content:space-between}
  .label{font-size:11px;letter-spacing:.12em;color:var(--label);font-weight:600}
  .badge{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600}
  .badge.seguro{color:var(--green-t)} .badge.atencao{color:var(--amber)}
  .badge.critico,.badge.limite{color:var(--red)}
  .big{display:flex;align-items:baseline;gap:6px;margin:6px 0 8px}
  .big .num{font-size:40px;font-weight:800;line-height:1}
  .big .unit{font-size:14px;color:var(--muted);font-weight:500}
  .track{height:8px;background:var(--track);border-radius:20px;overflow:hidden}
  .fill{height:100%;border-radius:20px;transition:width .5s ease}
  .fill.seguro{background:var(--green)} .fill.atencao{background:var(--amber)}
  .fill.critico,.fill.limite{background:var(--red)}
  .meta{display:flex;align-items:center;gap:7px;color:var(--text);font-size:12.5px;margin-top:10px}
  .meta.sub{color:var(--muted);margin-top:4px}
  .meta svg{color:var(--muted);flex:none}

  .chart{padding:14px 18px 4px}
  .chart .srow .trend{display:flex;align-items:center;gap:4px;color:var(--orange);
    font-size:12px;font-weight:600}
  svg.area{width:100%;height:70px;display:block;margin-top:8px}

  .foot{display:flex;align-items:center;gap:10px;padding:14px 18px;border-top:1px solid var(--border)}
  .foot .txt{display:flex;align-items:center;gap:7px;color:var(--text);font-size:13px;flex:1}
  .foot .txt svg{color:var(--amber)}
  .thr{width:46px;text-align:center;background:var(--card-2);border:1px solid var(--border);
    color:var(--text);border-radius:8px;font-size:12px;font-weight:600;padding:3px 4px;font-family:var(--font)}
  .switch{width:42px;height:24px;border-radius:20px;background:var(--track);position:relative;
    cursor:pointer;transition:background .2s;flex:none}
  .switch .knob{width:18px;height:18px;border-radius:50%;background:#fff;position:absolute;
    top:3px;left:3px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .switch.on{background:#3b82f6} .switch.on .knob{left:21px}

  /* ---------- skeleton (carregando) ---------- */
  .sk{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--track),var(--card-2),var(--track));
    background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .state{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted);
    padding:26px 18px;font-size:13px}
  .hidden{display:none!important}

  /* ---------- alcas de redimensionamento (janela frameless) ---------- */
  .rz{position:fixed;z-index:50;touch-action:none}
  .rz-r{top:36px;right:0;width:6px;bottom:6px;cursor:ew-resize}
  .rz-b{left:0;right:6px;bottom:0;height:6px;cursor:ns-resize}
  .rz-c{right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize}
  .rz-c::after{content:"";position:absolute;right:3px;bottom:3px;width:8px;height:8px;
    border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);opacity:.6}
</style>
</head>
<body>
  <div class="titlebar">
    <div class="drag pywebview-drag-region">
      <span id="updated" class="updated"></span>
    </div>
    <div id="pill" class="pill ok"><span class="dot"></span><span id="pillTxt">--%</span></div>
    <button class="winbtn" onclick="api('minimize')" title="Minimizar">
      <svg width="12" height="12" viewBox="0 0 12 12"><rect x="1" y="6" width="10" height="1.4" fill="currentColor"/></svg>
    </button>
    <button class="winbtn close" onclick="api('hide_window')" title="Fechar (fica na bandeja)">
      <svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.4"/></svg>
    </button>
  </div>

  <div class="wrap">
    <div class="card">
      <div class="head">
        <div class="logo">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="9"/><path d="M8 12h8M12 8v8"/></svg>
        </div>
        <div class="name">Claude API <span class="ver">v5.2</span></div>
        <button class="iconbtn" id="themeBtn" onclick="toggleTheme()" title="Tema claro/escuro">
          <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"></svg>
        </button>
        <button class="iconbtn" onclick="doRefresh()" title="Atualizar agora">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v5h-5"/></svg>
        </button>
        <button class="iconbtn" id="acctBtn" onclick="acctClick()" title="Conta">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
        </button>
      </div>

      <div id="authLine" class="authline hidden">● Conectado à sua conta Claude</div>

      <div id="banner" class="banner">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
        <span id="bannerTxt"></span>
      </div>

      <!-- estados especiais -->
      <div id="loading" class="hidden">
        <div class="section">
          <div class="sk" style="width:38%"></div>
          <div class="sk" style="width:70%;height:20px;margin-top:14px"></div>
          <div class="sk" style="width:100%;height:8px;margin-top:14px"></div>
        </div>
        <div class="state"><span>Carregando dados de uso...</span></div>
      </div>
      <div id="emptyState" class="state hidden">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="9"/><path d="M5 5l14 14"/></svg>
        <span id="emptyMsg">Sem dados de uso disponiveis</span>
      </div>

      <!-- tela de login OAuth (v5, uso pessoal) -->
      <div id="loginState" class="state hidden">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
        <div id="loginMsg" class="lmsg">Entre com a sua conta Claude para ver o uso.</div>
        <button class="btn-primary" onclick="doLogin()">Abrir login do Claude</button>
        <div class="paste">
          <input id="codeInput" placeholder="Cole o código (CODE#STATE)" spellcheck="false">
          <button class="btn-primary" onclick="submitCode()">Entrar</button>
        </div>
        <span class="lcancel" onclick="cancelLogin()">Cancelar</span>
      </div>

      <!-- conteudo principal -->
      <div id="content" class="hidden">
        <div id="sections"></div>
        <div id="creditsRow" class="credits hidden"></div>
        <div class="chart">
          <div class="srow">
            <span class="label">CONSUMO DIÁRIO · 7 D</span>
            <span class="trend" id="trend"></span>
          </div>
          <svg class="area" id="area" viewBox="0 0 320 70" preserveAspectRatio="none"></svg>
        </div>
      </div>

      <div class="foot">
        <div class="txt">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg>
          Avisar quando restar
          <input id="thr" class="thr" value="20%" inputmode="numeric">
        </div>
        <div id="sw" class="switch on" onclick="toggleAlert()"><span class="knob"></span></div>
      </div>
    </div>
  </div>

<style>
  .lmsg{font-size:12.5px;color:var(--muted);text-align:center;max-width:280px;line-height:1.5}
  .btn-primary{background:#D97757;color:#fff;border:0;border-radius:9px;padding:9px 14px;
    font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font,"Segoe UI")}
  .btn-primary:hover{background:#c2673f}
  .paste{display:flex;gap:6px;width:100%;max-width:300px}
  .paste #codeInput{flex:1;min-width:0;background:var(--card-2,#2e2d2a);color:var(--text,#faf9f5);
    border:1px solid var(--border,#3a3835);border-radius:9px;padding:8px 10px;font-size:12px;
    font-family:var(--font,"Segoe UI")}
  .lcancel{font-size:11px;color:var(--muted);cursor:pointer;text-decoration:underline}
  .authline{margin:0 18px 4px;font-size:11.5px;font-weight:600;color:var(--green-t,#7cc98f)}
  .credits{margin:2px 18px 8px;padding:9px 12px;border-radius:10px;
    background:rgba(224,140,62,.14);border:1px solid rgba(224,140,62,.35);
    color:var(--orange,#e08c3e);font-size:12.5px;font-weight:600}
</style>
<script>
const SUN='<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/>';
const MOON='<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';
let ALERT={threshold:20,enabled:true};

function api(method,...args){
  if(window.pywebview&&pywebview.api&&pywebview.api[method]) return pywebview.api[method](...args);
  return Promise.resolve(null);
}
function toggleTheme(){
  const h=document.documentElement;
  const next=h.getAttribute('data-theme')==='dark'?'light':'dark';
  h.setAttribute('data-theme',next); localStorage.setItem('theme',next); paintThemeIcon();
}
function paintThemeIcon(){
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  document.getElementById('themeIcon').innerHTML=dark?MOON:SUN;
}
function doRefresh(){ api('refresh_now').then(render); }

function statusText(s){return{seguro:'Seguro',atencao:'Atenção',critico:'Crítico',limite:'Limite atingido'}[s]||s;}
function statusIcon(s){
  if(s==='seguro') return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>';
  return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>';
}
const clockSvg='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function sectionHtml(l){
  return `<div class="section">
    <div class="srow"><span class="label">${l.name} · ${l.sub}</span>
      <span class="badge ${l.status}">${statusIcon(l.status)} ${statusText(l.status)}</span></div>
    <div class="big"><span class="num">${l.remaining}</span><span class="unit">% restante</span></div>
    <div class="track"><div class="fill ${l.status}" style="width:${Math.max(2,l.remaining)}%"></div></div>
    <div class="meta">${clockSvg} ${l.rhythm}</div>
    <div class="meta sub">${l.reset}</div>
  </div>`;
}

function drawChart(hist){
  const area=document.getElementById('area'), W=320,H=70,pad=6;
  const pts=(hist||[]).map(h=>h.week ?? h.session ?? 0);
  if(pts.length<2){ area.innerHTML=`<line x1="0" y1="${H-pad}" x2="${W}" y2="${H-pad}" stroke="var(--orange)" stroke-width="2"/>`;
    document.getElementById('trend').innerHTML=''; return; }
  const max=Math.max(10,...pts), min=Math.min(...pts);
  const nx=i=>pad+i*(W-2*pad)/(pts.length-1);
  const ny=v=>H-pad-(v-min)/((max-min)||1)*(H-2*pad);
  let d=pts.map((v,i)=>`${i?'L':'M'}${nx(i).toFixed(1)} ${ny(v).toFixed(1)}`).join(' ');
  const fill=`${d} L${nx(pts.length-1)} ${H} L${nx(0)} ${H} Z`;
  area.innerHTML=`<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--orange)" stop-opacity=".35"/>
      <stop offset="1" stop-color="var(--orange)" stop-opacity="0"/></linearGradient></defs>
    <path d="${fill}" fill="url(#g)"/><path d="${d}" fill="none" stroke="var(--orange)" stroke-width="2"/>
    <circle cx="${nx(pts.length-1)}" cy="${ny(pts[pts.length-1])}" r="2.6" fill="var(--orange)"/>`;
  const up=pts[pts.length-1]>=pts[0];
  document.getElementById('trend').innerHTML=(up?
    '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 18L20 6M20 6h-7M20 6v7"/></svg> em alta':
    '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 6l16 12M20 18h-7M20 18v-7"/></svg> em baixa');
}

function show(id){['loading','emptyState','loginState','content'].forEach(x=>
  document.getElementById(x).classList.toggle('hidden',x!==id));}

function setPill(rem,status){
  const p=document.getElementById('pill'); p.className='pill '+(status==='seguro'?'ok':status==='atencao'?'warn':'crit');
  document.getElementById('pillTxt').textContent=rem+'%';
}

let _lastH=0;
// Altura da janela = titlebar + conteudo do .wrap. O .wrap usa zoom, entao o
// conteudo e medido em px de LAYOUT (offsetHeight/padding) e convertido para px
// VISUAIS multiplicando pelo zoom — misturar os dois espacos deixava a janela
// curta e fazia aparecer barra de rolagem.
function autofit(){
  try{
    const wrap=document.querySelector('.wrap');
    const card=document.querySelector('.card');
    if(!wrap||!card) return;
    const cs=getComputedStyle(wrap);
    const z=parseFloat(cs.zoom)||1;
    const tb=document.querySelector('.titlebar').getBoundingClientRect().height;
    const pad=parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom);
    const need=Math.ceil(tb+(card.offsetHeight+pad)*z+2);
    const h=Math.max(300, Math.min(need, (screen.availHeight||900)-40));
    if(Math.abs(h-_lastH)>1){ _lastH=h; api('resize_window', 360, h); }
  }catch(e){}
}
// Reajusta sempre que o conteudo mudar de altura (dados novos, fonte que
// terminou de carregar, secao que apareceu), nao so no primeiro render.
function watchAutofit(){
  try{
    const card=document.querySelector('.card');
    if(window.ResizeObserver&&card) new ResizeObserver(()=>autofit()).observe(card);
    if(document.fonts&&document.fonts.ready) document.fonts.ready.then(autofit);
    window.addEventListener('load', autofit);
  }catch(e){}
}
function render(snap){ try{ _render(snap); } finally { setTimeout(autofit,0); } }
function _render(snap){
  if(!snap){ return; }
  if(snap.alert){ ALERT=snap.alert; syncAlertUI(); }
  const banner=document.getElementById('banner');
  if(snap.state==='loading'){ show('loading'); return; }
  if(snap.state==='login'){
    show('loginState');
    document.getElementById('loginMsg').textContent = snap.message ||
      'Entre com a sua conta Claude para ver o uso.';
    banner.classList.remove('show'); document.getElementById('pillTxt').textContent='—';
    updateAcct(snap); return;
  }
  if(snap.state==='error'||snap.state==='empty'){
    show('emptyState'); document.getElementById('emptyMsg').textContent=snap.message||'Sem dados';
    banner.classList.remove('show'); document.getElementById('pillTxt').textContent='—'; return;
  }
  // ok
  show('content');
  document.getElementById('updated').textContent=snap.updated?('atualizado '+snap.updated):'';
  document.getElementById('sections').innerHTML=snap.limits.map(sectionHtml).join('');
  drawChart(snap.history);
  setPill(snap.session_remaining, snap.session_status);
  updateAcct(snap);
  const cr=document.getElementById('creditsRow');
  if(snap.credits && snap.credits.used){
    cr.classList.remove('hidden');
    cr.innerHTML='⚡ Usando créditos: '+snap.credits.used+
      (snap.credits.limit?(' <span style="opacity:.65">de '+snap.credits.limit+'</span>'):'');
  } else { cr.classList.add('hidden'); }
  const al=snap.alert||{};
  if(snap.session_status==='limite'){
    banner.className='banner show'; document.getElementById('bannerTxt').textContent='Limite da sessão atingido — aguarde o reset';
  }else if(snap.session_status==='critico'){
    banner.className='banner show'; document.getElementById('bannerTxt').textContent=`Alerta: restam ${snap.session_remaining}% da sessão de 5 h`;
  }else if(al.enabled && snap.session_remaining<=al.threshold){
    banner.className='banner show'; document.getElementById('bannerTxt').textContent=`Aviso: restam ${snap.session_remaining}% da sessão (seu limite: ${al.threshold}%)`;
  }else{ banner.classList.remove('show'); }
}

/* ---- login OAuth (v5, uso pessoal) ---- */
function updateAcct(snap){
  const b=document.getElementById('acctBtn'); if(!b) return;
  const oauth = snap && snap.auth_mode==='oauth';
  b.dataset.mode = oauth ? 'oauth' : 'desktop';
  b.title = oauth ? 'Sair da conta' : 'Entrar na conta Claude';
  const al=document.getElementById('authLine');
  if(al) al.classList.toggle('hidden', !oauth);
}
function acctClick(){
  const b=document.getElementById('acctBtn');
  if(b && b.dataset.mode==='oauth'){ api('logout').then(render); }
  else { doLogin(); }
}
function doLogin(){ api('start_login').then(()=>api('get_data').then(render)); }
function submitCode(){
  const el=document.getElementById('codeInput'); const code=(el.value||'').trim();
  if(!code) return;
  el.value='';
  api('submit_login', code).then(()=>api('get_data').then(render));
}
function cancelLogin(){ api('cancel_login').then(render); }

/* ---- alerta ---- */
function syncAlertUI(){
  document.getElementById('sw').className='switch'+(ALERT.enabled?' on':'');
  const t=document.getElementById('thr'); if(document.activeElement!==t) t.value=ALERT.threshold+'%';
}
function toggleAlert(){ ALERT.enabled=!ALERT.enabled; syncAlertUI(); api('set_alert',ALERT.threshold,ALERT.enabled); }
document.getElementById('thr').addEventListener('change',e=>{
  const n=parseInt((e.target.value||'').replace(/\D/g,''))||20; ALERT.threshold=Math.max(1,Math.min(99,n));
  e.target.value=ALERT.threshold+'%'; api('set_alert',ALERT.threshold,ALERT.enabled);
});

/* ---- redimensionar (janela frameless) ---- */
const MINW=320, MINH=360;
(function(){
  let drag=null, pending=null, raf=0;
  function flush(){ raf=0; if(pending){ api('resize_window',pending.w,pending.h); pending=null; } }
  document.querySelectorAll('.rz').forEach(h=>{
    h.addEventListener('pointerdown',e=>{
      e.preventDefault(); try{h.setPointerCapture(e.pointerId);}catch(_){}
      drag={mode:h.dataset.rz,x:e.screenX,y:e.screenY,w:window.innerWidth,h:window.innerHeight};
    });
    h.addEventListener('pointermove',e=>{
      if(!drag) return;
      let w=drag.w, ht=drag.h;
      if(drag.mode==='r'||drag.mode==='c') w=Math.max(MINW, drag.w+(e.screenX-drag.x));
      if(drag.mode==='b'||drag.mode==='c') ht=Math.max(MINH, drag.h+(e.screenY-drag.y));
      pending={w:Math.round(w),h:Math.round(ht)};
      if(!raf) raf=requestAnimationFrame(flush);
    });
    const end=e=>{ if(drag){ try{h.releasePointerCapture(e.pointerId);}catch(_){} drag=null; flush(); } };
    h.addEventListener('pointerup',end); h.addEventListener('pointercancel',end);
  });
})();

/* ---- boot ---- */
const saved=localStorage.getItem('theme'); if(saved) document.documentElement.setAttribute('data-theme',saved);
paintThemeIcon();
function boot(){ watchAutofit(); api('get_data').then(render); api('refresh_now').then(render); }
if(window.pywebview) boot(); else window.addEventListener('pywebviewready',boot);
setInterval(()=>api('get_data').then(render),4000);   // reflete snapshot/tray
setInterval(()=>api('refresh_now').then(render),300000); // rede a cada 5 min
let _lastPos='';
setInterval(()=>{ const p=window.screenX+','+window.screenY;
  if(p!==_lastPos){ _lastPos=p; api('save_pos',window.screenX,window.screenY); } },2000); // lembra posicao
</script>
